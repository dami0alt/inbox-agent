[project]
name = "inbox-agent"
version = "0.1.0"
description = "Email triage agent and MCP server for a personal inbox"
readme = "README.md"
authors = [
    { name = "Damian", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
inbox-agent = "inbox_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # isort: sorted imports
    "UP",   # pyupgrade: modern Python syntax
    "B",    # bugbear: likely bugs
    "SIM",  # simplifications
    "C4",   # cleaner comprehensions
    "PT",   # pytest style
    "PTH",  # prefer pathlib over os.path
    "S",    # bandit: security smells
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
