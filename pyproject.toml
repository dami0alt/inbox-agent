[project]
name = "inbox-agent"
version = "0.1.0"
description = "Email triage agent and MCP server for a personal inbox"
readme = "README.md"
authors = [
    { name = "Damian", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
inbox-agent = "inbox_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
